; ═══ BANNER "App Protótipo" DESLIGADO NESTE APP (pedido do Murilo, 14/08/2026) ═══
; A hospedagem do appdemo injeta um <script> de aviso no topo de TODA resposta PHP, via
; auto_prepend_file = /home/wwcapr/public_html/appdemo/aviso.php. Aqui ele é desligado para a
; pasta do cockpit inteira — interface e endpoints.
;
; Vale lembrar por que isso importa além do visual: nos endpoints o banner saía ANTES do JSON e,
; com a saída já iniciada, o header Content-Type: application/json era ignorado — todo fetch do
; sistema quebrava. Por isso actions/.user.ini também desliga (e sobe o limite de upload): se um
; dia alguém apagar ESTE arquivo, os endpoints continuam de pé.
;
; O PHP relê .user.ini a cada 5 min (user_ini.cache_ttl), então a mudança não é instantânea.
auto_prepend_file = none
