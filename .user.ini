; LIMITE DE UPLOAD — medido em 14/08/2026: a hospedagem vinha com upload_max_filesize=2M e
; post_max_size=8M, enquanto o cockpit prometia 25 MB por anexo. Proposta de fornecedor escaneada
; passa de 2 MB com facilidade: o anexo falhava para quem mandava PDF grande e funcionava para quem
; mandava print pequeno — o que parecia "bug de permissão de um usuário" e não era.
;
; .user.ini (e não php_value no .htaccess): a hospedagem roda PHP como FPM/CGI, onde php_value no
; .htaccess derruba o site com 500. .user.ini é lido pelo próprio PHP e, se não for suportado,
; é simplesmente ignorado — não quebra nada.
;
; Vale para esta pasta e as de baixo. O PHP relê a cada 5 min (user_ini.cache_ttl), então a mudança
; não é instantânea. Se ainda assim ficar em 2M, o teto é da hospedagem e só o TI levanta
; (cPanel › MultiPHP INI Editor).
upload_max_filesize = 25M
post_max_size = 30M
max_file_uploads = 20
