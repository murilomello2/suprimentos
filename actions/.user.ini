; ═══ POR QUE ESTE ARQUIVO EXISTE (14/08/2026) ═══
; A hospedagem do appdemo tem auto_prepend_file = /home/wwcapr/public_html/appdemo/aviso.php: um
; <script> que injeta o banner "App Protótipo" no topo de TODA resposta PHP. Na tela isso é o
; desejado — é o aviso de que a URL é de protótipo e não deve circular.
;
; Nos ENDPOINTS é fatal: o banner sai ANTES do JSON, e como a saída já começou o
; header('Content-Type: application/json') é ignorado (a resposta vira text/html). Resultado
; medido: todo fetch do cockpit quebra no JSON.parse — o app inteiro para.
;
; Então o prepend é desligado AQUI, só na pasta dos endpoints. O index.php (a interface) continua
; com o banner, que é onde ele faz sentido e é visto por gente.
auto_prepend_file = none

; De carona, o limite de upload: a hospedagem vem com 2 MB por arquivo, e proposta de fornecedor
; escaneada passa disso — era o que impedia o comprador de anexar (medido em 14/08/2026). Upload
; só acontece por esta pasta, então o teto novo vale onde precisa.
upload_max_filesize = 25M
post_max_size = 30M
max_file_uploads = 20
